name: CI

# Lives at the repo root on purpose. The previous copy was at
# artbeat-deploy/.github/workflows/ci.yml, which GitHub never runs — Actions
# only reads workflows from `.github/workflows` at the root of the repository.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default token only needs to read the repo.
permissions:
  contents: read

jobs:
  server:
    name: server — typecheck + lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # `prisma generate` reads the datasource URL from the schema even though
      # it never connects. A dummy value keeps it from failing on a fresh
      # checkout; no test in this job touches a database.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Covers src/ AND scripts/ — the scraper was previously excluded from
      # typechecking entirely, which is how a venue-resolution bug survived.
      - name: Typecheck (src + scripts)
        run: npm run typecheck

      # Errors fail the job; `any` warnings are reported but allowed for now.
      - name: Lint (src + scripts)
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Production deps only: dev tools never reach the image. High and
      # critical advisories fail the job.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Builds the production image and boots it. Nothing is pushed anywhere.
  server-image:
    name: server — Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag artbeat-server:ci server

      # /health needs no database. /ready runs a real query against a closed
      # port, so it must answer 503 — and in doing so loads Prisma's query
      # engine, which is what breaks when the image has the wrong OpenSSL.
      - name: Smoke test
        run: |
          docker run -d --name api -p 3001:3001 \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/ci \
            -e SUPABASE_URL=http://localhost:54321 \
            -e SUPABASE_SERVICE_ROLE_KEY=ci-placeholder \
            artbeat-server:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3001/health && break
            sleep 1
          done
          curl -fsS http://localhost:3001/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/ready)" = 503
          if docker logs api 2>&1 | grep -iE 'libssl|openssl|query engine|Unable to require'; then
            echo "::error::Prisma's query engine failed to load in the image"
            exit 1
          fi
          # The release step runs `npx prisma migrate deploy` in this image;
          # --no-install fails if the pinned CLI isn't there.
          docker exec api npx --no-install prisma --version

      - name: Container logs
        if: always()
        run: docker logs api || true

  client:
    name: client — typecheck + lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      # The client reads these at build time; Vite inlines them. Dummy values
      # are fine because CI only checks that it compiles.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder
      VITE_API_URL: http://localhost:3001
      VITE_PROD_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # A build is the real check here: it catches missing env handling and
      # broken imports that `tsc --noEmit` alone will not.
      - name: Build
        run: npm run build
