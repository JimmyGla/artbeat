name: Refresh data

# Scheduled scrape → repair → audit.
#
# Requires one repository secret: DATABASE_URL (the Supabase *pooler* URI,
# session mode — the direct host is IPv6-only and GitHub runners cannot reach
# it). Settings → Secrets and variables → Actions.
#
# Until that secret exists this workflow fails fast with a clear message rather
# than half-running.
on:
  schedule:
    # 04:15 UTC daily — outside Italian business hours, and offset from the
    # top of the hour where Actions queues are busiest.
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Run repairs + audit only (no crawling)"
        type: boolean
        default: false

concurrency:
  # Never let two refreshes overlap; they would fight over the same rows.
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: scrape → repair → audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify DATABASE_URL secret is set
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL secret is not set. Add the Supabase pooler URI"
            echo "::error::under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "DATABASE_URL is present."

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # The scraper drives a real browser; the npm package alone is not enough.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Refresh
        run: |
          if [ "${{ inputs.skip_scrape }}" = "true" ]; then
            ./scripts/refresh.sh --skip-scrape
          else
            ./scripts/refresh.sh
          fi

      # Keep the log even when the refresh fails — that is when it is wanted.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log-${{ github.run_id }}
          path: server/logs/
          retention-days: 14
          if-no-files-found: warn
